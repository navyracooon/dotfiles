[general]
live_config_reload = true

[window]
padding = { x = 3, y = 3 }

[font]
normal.family = "HackGen Console NF"
normal.style = "Regular"
bold.family = "HackGen Console NF"
italic.family = "HackGen Console NF"
bold_italic.family = "HackGen Console NF"
size = 16.0

[colors.primary]
background = "0xffffff"
foreground = "0x4d4d4c"

[colors.cursor]
cursor = "0x4d4d4c"
text = "0xffffff"

[colors.normal]
black   = "0xffffff"
red     = "0xc82829"
green   = "0x718c00"
yellow  = "0xeab700"
blue    = "0x4271ae"
magenta = "0x8959a8"
cyan    = "0x3e999f"
white   = "0x4d4d4c"

[colors.bright]
black   = "0x8e908c"
red     = "0xf5871f"
green   = "0xe0e0e0"
yellow  = "0xd6d6d6"
blue    = "0x969896"
magenta = "0x282a2e"
cyan    = "0xa3685a"
white   = "0x1d1f21"
